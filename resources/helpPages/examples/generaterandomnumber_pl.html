<!DOCTYPE html>
<html>
<head>
<style>
    code {
        background-color: #161719;
        color: #ffffff;
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        line-height: 1.5;
    }
    .op-mvi { color: #ADD8E6; }
    .op-mov { color: #ADD8E6; }
    .op-out { color: #7f007f; }
    .op-hlt { color: #7f007f; }
    .op-dcr { color: #ffff00; }
    .op-jnz { color: #FFA500; }

    .label { color: #1E90FF; }
    .register { color: #ffffff; }
</style>
</head>
<body>


<h1>Wygeneruj losową liczbę</h1>

<p>Ten przykład pokazuje jak wygenerować losową liczbę używając generatora liczb losowych. Na wyjściu 6 ustawiana jest maksymalna liczba która może zostać wylosowana. Następnie na wejściu 6 odczytywana jest wylosowana liczba.</p>

<div class="code">
    <div><span class="op-mvi">MVI</span> A,FFH</div>
    <div><span class="op-out">OUT</span> 06</div>
    <div><span class="op-mvi">IN</span> 06</div>
    <div><span class="op-hlt">HLT</span></div>
</div>

</body>
</html>
