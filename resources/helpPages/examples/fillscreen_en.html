<!DOCTYPE html>
<html>
<head>
<style>
    code {
        background-color: #161719;
        color: #ffffff;
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        line-height: 1.5;
    }
    .op-mvi { color: #ADD8E6; }
    .op-mov { color: #ADD8E6; }
    .op-out { color: #7f007f; }
    .op-hlt { color: #7f007f; }
    .op-dcr { color: #ffff00; }
    .op-jnz { color: #FFA500; }

    .label { color: #1E90FF; }
    .register { color: #ffffff; }
</style>
</head>
<body>


<h1>Fill screen example</h1>

<p>To fill the screen with color, set the fill mode and specify a color. In this example, the screen will be filled with color 0x43.</p>


<div class="code">
    <div><span class="op-mvi">MVI</span> A,5</div>
    <div><span class="op-out">OUT</span> 05</div>
    <div><span class="op-mvi">MVI</span> A,43</div>
    <div><span class="op-out">OUT</span> 04</div>
    <div><span class="op-hlt">HLT</span></div>
</div>

<p align="center">
    <img src=":/examples/helpPages/examples/images/fillscreen.png"/>
</p>

</body>
</html>
