<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <style>
        code {
            background-color: #161719;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        .op-mvi { color: #ADD8E6; }
        .op-out { color: #7f007f; }
        .op-push { color: #90EE90; }
    </style>
  </head>
  <body>
    <h1>GCFELIPSE</h1>
    <p>Sets the center of the filled elipse at the cursor position.</p>
    <h3>Macro code:</h3>
    <div class="code">
        <div><span class="op-push">PUSH</span> PSW</div>
        <div><span class="op-mvi">MVI </span> A,06</div>
        <div><span class="op-out">OUT</span> 05</div>
        <div><span class="op-push">POP</span> PSW</div>
    </div>
  </body>
