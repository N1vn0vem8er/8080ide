<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <style>
        code {
            background-color: #161719;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        .op-mvi { color: #ADD8E6; }
        .op-out { color: #7f007f; }
        .op-push { color: #90EE90; }
    </style>
  </head>
  <body>
    <h3>GLINE</h3>
    <p>There are 2 macros for drawing line GLINE1 and GLINE2. GLINE1 sets position 1 for line and GLINE2 sets position 2.</p>
    <h3>GLINE1 code:</h3>
    <div class="code">
        <div><span class="op-push">PUSH</span> PSW</div>
        <div><span class="op-mvi">MVI </span> A,01</div>
        <div><span class="op-out">OUT</span> 05</div>
        <div><span class="op-push">POP</span> PSW</div>
    </div>
    <h3>GLINE2 code:</h3>
    <div class="code">
        <div><span class="op-push">PUSH</span> PSW</div>
        <div><span class="op-mvi">MVI </span> A,02</div>
        <div><span class="op-out">OUT</span> 05</div>
        <div><span class="op-push">POP</span> PSW</div>
    </div>
  </body>
</html>
